# Pet Moments public status page (SPEC-121, Phase 0).
#
# This file is the config for a SEPARATE public repo, stevenmunoz/petmoments-status,
# created from https://github.com/upptime/upptime ("Use this template"). It
# lives here so it is reviewed with the code it probes; copy it to the root
# of that repo. See README.md in this folder for the one-time setup.
#
# Why outside GCP: GitHub Actions probes from Azure and GitHub Pages serves
# the page, so both keep working when Firebase / Cloud Run / GCP is down —
# the failure the 2026-10-22 outage showed we could not see.

owner: stevenmunoz
repo: petmoments-status

sites:
  # CDN-served landing page.
  - name: Website
    url: https://petmoments.app/
    maxResponseTime: 5000

  # Dynamic (no-store) client page: every probe reaches the SSR renderer
  # (ssrpetmomentsprod) without Firestore reads. Same target as SPEC-120 web-ssr.
  - name: Pet Moments Pro
    url: https://petmoments.app/share/smoke-test-token/
    maxResponseTime: 8000

  # An unauthenticated POST answers 401 only if a function instance booted
  # and ran our code. Same probe as SPEC-120 backend-callable.
  - name: App and Pro backend
    url: https://us-central1-petmoments-prod.cloudfunctions.net/checkUsernameAvailability
    method: POST
    body: '{"data":{}}'
    headers:
      - "Content-Type: application/json"
    expectedStatusCodes:
      - 401
    maxResponseTime: 8000

status-website:
  cname: status.petmoments.app
  logoUrl: https://petmoments.app/logo.png
  favicon: https://petmoments.app/favicon-32x32.png
  name: Pet Moments Status
  introTitle: "Pet Moments system status"
  introMessage: "Live availability of the Pet Moments app, Pet Moments Pro and our website. Checked every 5 minutes from outside our own infrastructure."
  navbar:
    - title: Status
      href: /
    - title: Pet Moments
      href: https://petmoments.app/
  theme: light

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * 0"
  updates: "0 3 * * *"

# Incidents open as GitHub issues assigned here; a human writes the public text.
assignees:
  - stevenmunoz
